[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulletproof-llm-wrapper"
version = "0.1.0"
description = "A resilient LLM wrapper with retries and exponential backoff"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
